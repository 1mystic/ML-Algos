<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ML Explorer Lab</title>
<meta name="description" content="Interactive machine-learning lab: every classic algorithm implemented from scratch in the browser, with animated step-by-step training, architecture diagrams and full reference sheets." />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141414'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%23ffffff' text-anchor='middle'%3E%26%23955%3B%3C/text%3E%3C/svg%3E" />
<!-- KaTeX typesets every equation. If this stylesheet cannot load, the
     formulas fall back to native MathML automatically (see Lab.texHTML). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="explorer.css" />
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <button class="menu-toggle" id="menu-toggle" aria-label="Toggle sidebar" aria-expanded="true">☰</button>
    <a class="brand" href="#/" aria-label="Go to home"><span class="glyph">λ</span> ml-explorer&nbsp;<span style="color:var(--text-faint);font-weight:400;">/ lab</span></a>
  </div>
  <div class="topbar-right">
    <div class="search" id="search">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="text" id="search-input" placeholder="search algorithms, concepts" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="search-results" aria-label="Search algorithms" />
      <kbd class="search-kbd" id="search-kbd">/</kbd>
      <div class="search-results" id="search-results" role="listbox" hidden></div>
    </div>
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme">
      <svg id="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      <svg id="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <span id="theme-toggle-label">dark</span>
    </button>
  </div>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar-nav"></div>
  <div class="main" id="main"></div>
</div>
<div class="statusbar" id="statusbar" aria-live="polite">
  <span class="sb-item"><span class="sb-dot"></span><b id="sb-algo">home</b></span>
  <span class="sb-item sb-hide-m" id="sb-phase"></span>
  <span class="sb-item" id="sb-frame"></span>
  <span class="sb-right">
    <span class="sb-item sb-hide-m"><kbd>space</kbd> play <kbd>←</kbd><kbd>→</kbd> step <kbd>?</kbd> shortcuts</span>
    <span class="sb-item sb-hide-m">runs entirely in your browser</span>
  </span>
</div>

<!-- CDN libraries (pinned): D3 renders every plot and diagram, TensorFlow.js
     trains the neural labs, KaTeX typesets the maths. -->
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>

<script>MLApp.init();</script>
</body>
</html>
